name: Sync basketball data
on:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/engine-data.json"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      full_backfill:
        description: "Run extended historical backfill (NBA 35 days; EuroLeague 2024-2026)"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: data-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch public scores and player box scores
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FULL_BACKFILL: ${{ inputs.full_backfill || 'false' }}
        run: node scripts/sync-data.mjs
      - name: Commit updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/engine-data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: refresh basketball data"
            git pull --rebase origin main
            git push
          fi
      - name: Install frontend dependencies
        run: npm install
      - name: Build production site
        run: npm run build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy updated site and data
        id: deployment
        uses: actions/deploy-pages@v4
